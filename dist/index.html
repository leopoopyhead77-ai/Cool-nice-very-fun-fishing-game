   and a light rendering of it would be a different, worse object.
   -------------------------------------------------------------------------- */

:root {
  color-scheme: dark;

  --abyss: #04080d;
  --hull: #0b1520;
  --hull-2: #0f1c29;
  --hull-3: #14273a;
  --hairline: #1b2c3b;
  --hairline-2: #24394c;

  --ink: #c9d9e5;
  --ink-dim: #9fb2c0;
  --muted: #6e8697;
  --faint: #47596a;

  --amber: #f0a63c;
  --amber-dim: #a06f22;
  --cyan: #2fa8cc;
  --good: #4fbf87;
  --alert: #e05a4e;

  --area: var(--cyan);

  --f-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --r: 3px;
  --gap: 10px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  background: var(--abyss);
}

body {
  font-family: var(--f-mono);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

#root {
  height: 100%;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}

:where(button, [tabindex]):focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}

/* --- shell ---------------------------------------------------------------- */

.app {
  display: flex;
  flex-direction: column;
  height: 100vh; /* fallback for WebViews without dvh */
  height: 100dvh;
  max-width: 620px;
  margin: 0 auto;
  background: linear-gradient(180deg, #050a11 0%, var(--abyss) 40%);
  border-left: 1px solid var(--hairline);
  border-right: 1px solid var(--hairline);
  position: relative;
  overflow: hidden;
}

/* --- gauge strip ---------------------------------------------------------- */

.strip {
  flex: none;
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: stretch;
  gap: 1px;
  background: var(--hairline);
  border-bottom: 1px solid var(--hairline);
  padding-top: env(safe-area-inset-top);
}

.strip > * {
  background: var(--hull);
  padding: 7px 11px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  justify-content: center;
}

.strip-label {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 9px;
  letter-spacing: 0.16em;
  color: var(--faint);
  text-transform: uppercase;
}

.strip-value {
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.coins .strip-value {
  color: var(--amber);
}

.strip .area-btn {
  text-align: left;
  min-width: 0;
}

.strip .area-btn .strip-value {
  font-size: 12px;
  color: var(--area);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 22ch;
}

/* --- content well --------------------------------------------------------- */

.well {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: var(--gap) var(--gap) 14px;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

/* The well scrolls, so nothing inside it may be compressed to fit. */
.well > * {
  flex: 0 0 auto;
}

.well::-webkit-scrollbar {
  width: 4px;
}
.well::-webkit-scrollbar-thumb {
  background: var(--hairline-2);
}

.panel {
  background: var(--hull);
  border: 1px solid var(--hairline);
  border-radius: var(--r);
}

.panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 11px;
  border-bottom: 1px solid var(--hairline);
}

.panel-title {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.panel-note {
  font-size: 10px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}

.panel-body {
  padding: 11px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* --- echo sounder --------------------------------------------------------- */

.sounder {
  position: relative;
  border: 1px solid var(--hairline);
  border-radius: var(--r);
  overflow: hidden;
  background: #030a10;
}

.sounder canvas {
  display: block;
  width: 100%;
  height: 152px;
}

.sounder-hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  padding: 7px 9px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-size: 9px;
  letter-spacing: 0.1em;
  color: rgba(160, 190, 210, 0.55);
}

.sounder-hud .row {
  display: flex;
  justify-content: space-between;
}

.sounder-status {
  font-family: var(--f-display);
  font-weight: 600;
  letter-spacing: 0.2em;
  font-size: 10px;
  color: var(--area);
  text-transform: uppercase;
}

/* --- readout rows --------------------------------------------------------- */

.readout {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--hairline);
  border: 1px solid var(--hairline);
  border-radius: var(--r);
}

.readout > div {
  background: var(--hull-2);
  padding: 6px 7px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.readout .k {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 8.5px;
  letter-spacing: 0.14em;
  color: var(--faint);
  text-transform: uppercase;
}

.readout .v {
  font-size: 12px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* --- minigame tracks ------------------------------------------------------ */

.track {
  position: relative;
  height: 60px;
  border: 1px solid var(--hairline-2);
  border-radius: var(--r);
  background: repeating-linear-gradient(
      90deg,
      rgba(255, 255, 255, 0.035) 0 1px,
      transparent 1px 100%
    )
    0 0 / 5% 100%,
    linear-gradient(180deg, #081420, #050d15);
  overflow: hidden;
  touch-action: none;
}

.sweet {
  position: absolute;
  top: 0;
  bottom: 0;
  background: linear-gradient(
    180deg,
    rgba(240, 166, 60, 0.28),
    rgba(240, 166, 60, 0.1)
  );
  border-left: 1px solid rgba(240, 166, 60, 0.65);
  border-right: 1px solid rgba(240, 166, 60, 0.65);
}

.sweet.core {
  background: rgba(240, 166, 60, 0.5);
  border-left-color: var(--amber);
  border-right-color: var(--amber);
}

.marker {
  position: absolute;
  top: -1px;
  bottom: -1px;
  width: 3px;
  margin-left: -1.5px;
  background: var(--ink);
  box-shadow: 0 0 10px rgba(201, 217, 229, 0.8);
}

.bracket {
  position: absolute;
  top: 3px;
  bottom: 3px;
  border: 1px solid var(--amber);
  border-radius: 2px;
  background: rgba(240, 166, 60, 0.14);
  box-shadow: inset 0 0 12px rgba(240, 166, 60, 0.18);
}

.bracket::before,
.bracket::after {
  content: "";
  position: absolute;
  top: -3px;
  bottom: -3px;
  width: 2px;
  background: var(--amber);
}
.bracket::before {
  left: -1px;
}
.bracket::after {
  right: -1px;
}

.blip {
  position: absolute;
  top: 50%;
  width: 12px;
  height: 12px;
  margin: -6px 0 0 -6px;
  border-radius: 50%;
  background: var(--rar, var(--cyan));
  box-shadow: 0 0 14px var(--rar-glow, rgba(47, 168, 204, 0.6));
}

.blip::after {
  content: "";
  position: absolute;
  inset: -7px;
  border: 1px solid var(--rar, var(--cyan));
  border-radius: 50%;
  opacity: 0.35;
}

.meter {
  position: relative;
  height: 14px;
  border: 1px solid var(--hairline-2);
  border-radius: 2px;
  background: #050d15;
  overflow: hidden;
}

.meter-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: linear-gradient(90deg, rgba(79, 191, 135, 0.5), var(--good));
  transition: background-color 0.2s;
}

.meter.danger .meter-fill {
  background: linear-gradient(90deg, rgba(224, 90, 78, 0.5), var(--alert));
}

.meter-ticks {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
      90deg,
      transparent 0 calc(10% - 1px),
      rgba(4, 8, 13, 0.65) calc(10% - 1px) 10%
    );
}

/* --- big action ----------------------------------------------------------- */

.dock {
  flex: none;
  border-top: 1px solid var(--hairline);
  background: linear-gradient(180deg, var(--hull), #070f18);
  padding: 10px 10px calc(8px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.action {
  height: 86px;
  width: 100%;
  border: 1px solid var(--amber-dim);
  border-radius: var(--r);
  background: linear-gradient(180deg, #1c2a1b00, rgba(240, 166, 60, 0.1));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

.action-main {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 24px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--amber);
  text-indent: 0.2em;
}

.action-sub {
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--muted);
  text-transform: uppercase;
}

.action[data-mode="hook"] {
  border-color: var(--alert);
  background: rgba(224, 90, 78, 0.16);
  animation: hookpulse 0.42s steps(2, end) infinite;
}
.action[data-mode="hook"] .action-main {
  color: #ff8f84;
}

.action[data-mode="reel"] {
  border-color: var(--cyan);
  background: rgba(47, 168, 204, 0.12);
}
.action[data-mode="reel"] .action-main {
  color: #7fd4ee;
}

.action[data-mode="reel"].held {
  background: rgba(47, 168, 204, 0.3);
  box-shadow: inset 0 0 30px rgba(47, 168, 204, 0.3);
}

.action:disabled {
  opacity: 0.4;
  border-color: var(--hairline-2);
}
.action:disabled .action-main {
  color: var(--muted);
}

.action:active:not(:disabled) {
  transform: translateY(1px);
}

@keyframes hookpulse {
  50% {
    background: rgba(224, 90, 78, 0.34);
  }
}

/* --- tab rail ------------------------------------------------------------- */

.tabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: var(--hairline);
  border: 1px solid var(--hairline);
  border-radius: var(--r);
  overflow: hidden;
}

.tab {
  background: var(--hull-2);
  padding: 9px 2px 8px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  position: relative;
}

.tab[aria-selected="true"] {
  background: var(--hull-3);
  color: var(--amber);
}

.tab[aria-selected="true"]::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 2px;
  background: var(--amber);
}

.tab .badge {
  display: block;
  font-family: var(--f-mono);
  font-size: 9px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
}

.tab[aria-selected="true"] .badge {
  color: var(--ink-dim);
}

/* --- lists / cards -------------------------------------------------------- */

.list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.item {
  display: grid;
  grid-template-columns: 3px 1fr auto;
  gap: 9px;
  align-items: center;
  background: var(--hull-2);
  border: 1px solid var(--hairline);
  border-radius: var(--r);
  padding: 8px 9px 8px 0;
  text-align: left;
  width: 100%;
}

.item .stripe {
  align-self: stretch;
  background: var(--rar);
  border-radius: var(--r) 0 0 var(--r);
}

.item .name {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.item .meta {
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

.item .price {
  font-size: 13px;
  font-weight: 600;
  color: var(--amber);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.chip {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 8.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 2px 5px;
  border-radius: 2px;
  border: 1px solid currentColor;
  line-height: 1.2;
  white-space: nowrap;
}

.mut-chip {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 8.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* --- buttons -------------------------------------------------------------- */

.btn {
  border: 1px solid var(--hairline-2);
  border-radius: var(--r);
  background: var(--hull-3);
  padding: 9px 12px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-dim);
  min-height: 40px;
}

.btn:active {
  background: #1b3145;
}

.btn.primary {
  border-color: var(--amber-dim);
  color: var(--amber);
  background: rgba(240, 166, 60, 0.12);
}

.btn.danger {
  border-color: #6d2c26;
  color: #ef8378;
  background: rgba(224, 90, 78, 0.1);
}

.btn.ghost {
  background: transparent;
}

.btn:disabled {
  opacity: 0.35;
}

.btn-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.btn-row .btn {
  flex: 1 1 auto;
}

.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 1px;
  background: var(--hairline);
  border: 1px solid var(--hairline);
  border-radius: var(--r);
  overflow: hidden;
}

.seg button {
  background: var(--hull-2);
  padding: 8px 4px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.seg button[aria-pressed="true"] {
  background: var(--hull-3);
  color: var(--amber);
}

/* --- result card ---------------------------------------------------------- */

.result {
  border: 1px solid var(--rar);
  border-radius: var(--r);
  background: linear-gradient(180deg, var(--rar-wash), var(--hull));
  padding: 13px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  animation: rise 0.28s ease-out;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}

.result-name {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 0.02em;
  color: var(--rar);
  text-wrap: balance;
  line-height: 1.1;
}

.result-value {
  font-size: 20px;
  font-weight: 600;
  color: var(--amber);
  font-variant-numeric: tabular-nums;
}

.hr {
  height: 1px;
  background: var(--hairline);
}

.empty {
  padding: 22px 12px;
  text-align: center;
  color: var(--faint);
  font-size: 11px;
  letter-spacing: 0.06em;
  line-height: 1.7;
}

/* --- rare-signal flash ---------------------------------------------------- */

.signal-flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  box-shadow: inset 0 0 0 2px var(--rar), inset 0 0 60px var(--rar-glow);
  animation: signal 1.1s ease-out forwards;
}

@keyframes signal {
  0% {
    opacity: 0;
  }
  18% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}

.signal-word {
  position: absolute;
  top: 42%;
  left: 0;
  right: 0;
  text-align: center;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.34em;
  color: var(--rar);
  text-transform: uppercase;
  text-shadow: 0 0 18px var(--rar-glow);
}

.toast {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 8px;
  z-index: 6;
  background: var(--hull-3);
  border: 1px solid var(--hairline-2);
  border-left: 3px solid var(--amber);
  border-radius: var(--r);
  padding: 9px 11px;
  font-size: 11px;
  color: var(--ink-dim);
  animation: rise 0.2s ease-out;
  pointer-events: none;
}

/* --- misc ----------------------------------------------------------------- */

.kv {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.kv b {
  color: var(--ink);
  font-weight: 600;
}

.note {
  font-size: 10.5px;
  color: var(--faint);
  line-height: 1.6;
}

.bar-mini {
  height: 4px;
  border-radius: 2px;
  background: var(--hull-3);
  overflow: hidden;
}

.bar-mini > i {
  display: block;
  height: 100%;
  background: var(--amber);
}

.grid2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}

.locked {
  opacity: 0.45;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
