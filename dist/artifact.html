/* --------------------------------------------------------------------------
   SOUNDING LINE — a quiet afternoon by the water.
   One warm daylight theme on purpose: the painted scene is the hero, and a
   dark chrome would fight it.
   -------------------------------------------------------------------------- */

:root {
  color-scheme: light;

  --sand: #efe7d5;
  --card: #fdfbf5;
  --card-2: #f7f1e3;
  --card-3: #efe6d2;
  --edge: #dcd1b8;
  --edge-2: #c8bb9e;

  --ink: #33403a;
  --ink-dim: #56675e;
  --muted: #7c8c81;
  --faint: #9aa89d;

  --lake: #1f7a6b;
  --lake-deep: #145c50;
  --lake-soft: #dcefe9;
  --gold: #c98a12;
  --gold-soft: #fbefd5;
  --good: #2e9c63;
  --alert: #d4553f;

  --area: var(--lake);

  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;

  --r: 14px;
  --r-sm: 9px;
  --gap: 10px;
  --shadow: 0 1px 2px rgba(60, 50, 30, 0.06), 0 4px 12px rgba(60, 50, 30, 0.05);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  background: var(--sand);
}

body {
  font-family: var(--f-body);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

#root {
  height: 100%;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}

:where(button, [tabindex]):focus-visible {
  outline: 2px solid var(--lake);
  outline-offset: 2px;
}

/* --- shell ---------------------------------------------------------------- */

.app {
  display: flex;
  flex-direction: column;
  height: 100vh; /* fallback for WebViews without dvh */
  height: 100dvh;
  max-width: 620px;
  margin: 0 auto;
  background: var(--sand);
  position: relative;
  overflow: hidden;
}

/* --- top bar -------------------------------------------------------------- */

.strip {
  flex: none;
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 10px;
  padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
  background: var(--card);
  border-bottom: 1px solid var(--edge);
}

.strip > * {
  display: flex;
  flex-direction: column;
  gap: 1px;
  justify-content: center;
  min-width: 0;
}

.strip-label {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 9.5px;
  letter-spacing: 0.1em;
  color: var(--faint);
  text-transform: uppercase;
}

.strip-value {
  font-family: var(--f-display);
  font-size: 17px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
}

.coins .strip-value {
  color: var(--gold);
}

.strip .area-btn {
  text-align: left;
  align-items: flex-start;
  background: var(--lake-soft);
  border-radius: 999px;
  padding: 5px 13px;
}

.strip .area-btn .strip-value {
  font-size: 13px;
  color: var(--area);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 15ch;
}

/* --- content well --------------------------------------------------------- */

.well {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: var(--gap) var(--gap) 16px;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

/* The well scrolls, so nothing inside it may be compressed to fit. */
.well > * {
  flex: 0 0 auto;
}

.well::-webkit-scrollbar {
  width: 5px;
}
.well::-webkit-scrollbar-thumb {
  background: var(--edge);
  border-radius: 3px;
}

.panel {
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 11px 13px 5px;
}

.panel-title {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 15px;
  color: var(--ink);
  margin: 0;
}

.panel-note {
  font-size: 11.5px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}

.panel-body {
  padding: 5px 13px 13px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* --- the scene ------------------------------------------------------------ */

.scene {
  position: relative;
  border-radius: var(--r);
  overflow: hidden;
  background: var(--lake-soft);
  border: 1px solid var(--edge);
  box-shadow: var(--shadow);
}

.scene canvas {
  display: block;
  width: 100%;
  height: 208px;
}

.scene-hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 10px 13px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
}

.scene-place {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 17px;
  color: #fff;
}

.scene-foot {
  position: absolute;
  left: 11px;
  right: 11px;
  bottom: 11px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}

.scene-status {
  background: rgba(255, 253, 247, 0.93);
  color: var(--ink-dim);
  border-radius: 999px;
  padding: 5px 13px;
  font-size: 12.5px;
  font-weight: 700;
}

.scene-when {
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}

/* --- readout chips -------------------------------------------------------- */

.readout {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.readout > div {
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: var(--r-sm);
  padding: 7px 8px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.readout .k {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 9px;
  letter-spacing: 0.08em;
  color: var(--faint);
  text-transform: uppercase;
}

.readout .v {
  font-size: 12.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* --- minigame tracks ------------------------------------------------------ */

.track {
  position: relative;
  height: 62px;
  border-radius: 12px;
  background: linear-gradient(180deg, #e7f1ee, #d5e6e1);
  border: 1px solid var(--edge);
  overflow: hidden;
  touch-action: none;
}

.sweet {
  position: absolute;
  top: 0;
  bottom: 0;
  background: rgba(46, 156, 99, 0.25);
}

.sweet.core {
  background: rgba(46, 156, 99, 0.55);
}

.marker {
  position: absolute;
  top: -1px;
  bottom: -1px;
  width: 4px;
  margin-left: -2px;
  border-radius: 3px;
  background: var(--ink);
}

.bracket {
  position: absolute;
  top: 5px;
  bottom: 5px;
  border: 2.5px solid var(--lake);
  border-radius: 10px;
  background: rgba(31, 122, 107, 0.14);
}

.blip {
  position: absolute;
  top: 50%;
  width: 22px;
  height: 22px;
  margin: -11px 0 0 -11px;
  border-radius: 50%;
  background: var(--rar, var(--lake));
  border: 2.5px solid #fff;
  box-shadow: 0 2px 6px rgba(40, 60, 50, 0.3);
}

.meter {
  position: relative;
  height: 16px;
  border-radius: 999px;
  background: var(--card-3);
  border: 1px solid var(--edge);
  overflow: hidden;
}

.meter-fill {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 999px;
  background: linear-gradient(90deg, #58c48a, var(--good));
}

.meter.danger .meter-fill {
  background: linear-gradient(90deg, #eb8a76, var(--alert));
}

.meter-ticks {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    90deg,
    transparent 0 calc(20% - 1.5px),
    rgba(255, 255, 255, 0.55) calc(20% - 1.5px) 20%
  );
}

/* --- the big button ------------------------------------------------------- */

.dock {
  flex: none;
  position: relative;
  background: var(--card);
  border-top: 1px solid var(--edge);
  padding: 10px 10px calc(8px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.action {
  height: 88px;
  width: 100%;
  border-radius: 18px;
  background: var(--lake);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  box-shadow: 0 4px 0 var(--lake-deep);
  user-select: none;
  -webkit-user-select: none;
  transition: transform 0.06s, box-shadow 0.06s;
}

.action-main {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 30px;
  line-height: 1.05;
}

.action-sub {
  font-size: 12px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.85);
}

.action[data-mode="hook"] {
  background: var(--alert);
  box-shadow: 0 4px 0 #a63c2b;
  animation: hookpulse 0.45s ease-in-out infinite alternate;
}

.action[data-mode="reel"] {
  background: #2f88b8;
  box-shadow: 0 4px 0 #1f6790;
}

.action:active:not(:disabled),
.action[data-mode="reel"].held {
  transform: translateY(4px);
  box-shadow: 0 0 0 var(--lake-deep);
}

.action[data-mode="reel"].held {
  background: #37a0d6;
}

.action:disabled {
  background: var(--card-3);
  color: var(--muted);
  box-shadow: 0 4px 0 var(--edge);
}

.action:disabled .action-sub {
  color: var(--faint);
}

@keyframes hookpulse {
  to {
    background: #ef7358;
  }
}

/* --- tab bar -------------------------------------------------------------- */

.tabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  background: var(--card-2);
  border-radius: 999px;
  padding: 4px;
}

.tab {
  border-radius: 999px;
  padding: 7px 2px 6px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.15;
}

.tab[aria-selected="true"] {
  background: var(--lake);
  color: #fff;
}

.tab .badge {
  display: block;
  font-family: var(--f-body);
  font-weight: 700;
  font-size: 9.5px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}

.tab[aria-selected="true"] .badge {
  color: rgba(255, 255, 255, 0.85);
}

/* --- lists / cards -------------------------------------------------------- */

.list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.item {
  display: grid;
  grid-template-columns: 5px 1fr auto;
  gap: 10px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: var(--r-sm);
  padding: 9px 11px 9px 0;
  text-align: left;
  width: 100%;
  overflow: hidden;
}

.item .stripe {
  align-self: stretch;
  background: var(--rar);
}

.item .name {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.item .meta {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 1px;
  font-variant-numeric: tabular-nums;
}

.item .price {
  font-family: var(--f-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.chip {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 10px;
  padding: 2px 9px;
  border-radius: 999px;
  border: 1.5px solid currentColor;
  line-height: 1.4;
  white-space: nowrap;
}

.mut-chip {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 10.5px;
}

/* --- buttons -------------------------------------------------------------- */

.btn {
  border: 1px solid var(--edge-2);
  border-radius: var(--r-sm);
  background: var(--card-2);
  padding: 10px 12px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 13px;
  color: var(--ink-dim);
  min-height: 44px;
}

.btn:active {
  background: var(--card-3);
}

.btn.primary {
  background: var(--lake);
  border-color: var(--lake-deep);
  color: #fff;
}

.btn.primary:active {
  background: var(--lake-deep);
}

.btn.danger {
  background: #fbe7e2;
  border-color: #e6b4a8;
  color: #a8412f;
}

.btn.ghost {
  background: var(--card);
}

.btn:disabled {
  opacity: 0.45;
}

.btn-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.btn-row .btn {
  flex: 1 1 auto;
}

.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  background: var(--card-2);
  border-radius: 999px;
  padding: 4px;
}

.seg button {
  border-radius: 999px;
  padding: 9px 4px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 13px;
  text-transform: capitalize;
  color: var(--muted);
}

.seg button[aria-pressed="true"] {
  background: var(--lake);
  color: #fff;
}

/* --- result card ---------------------------------------------------------- */

.result {
  border: 2px solid var(--rar);
  border-radius: var(--r);
  background: var(--rar-wash);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  box-shadow: var(--shadow);
  animation: rise 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
  }
}

.result-name {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 25px;
  color: var(--rar);
  text-wrap: balance;
  line-height: 1.1;
  margin: 0;
}

.result-value {
  font-family: var(--f-display);
  font-size: 23px;
  font-weight: 600;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}

.hr {
  height: 1px;
  background: rgba(0, 0, 0, 0.1);
}

.empty {
  padding: 26px 14px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
}

/* --- big-fish flash ------------------------------------------------------- */

.signal-flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  box-shadow: inset 0 0 0 5px var(--rar);
  animation: signal 1.2s ease-out forwards;
}

@keyframes signal {
  0% {
    opacity: 0;
  }
  16% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}

.signal-word {
  position: absolute;
  top: 30%;
  left: 0;
  right: 0;
  text-align: center;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 26px;
  color: #fff;
  text-shadow: 0 2px 0 var(--rar), 0 4px 16px rgba(0, 0, 0, 0.35);
  animation: pop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1);
}

@keyframes pop {
  from {
    transform: scale(0.7);
    opacity: 0;
  }
}

.toast {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: calc(100% + 8px);
  z-index: 6;
  background: var(--ink);
  color: #fdfbf5;
  border-radius: 999px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  box-shadow: 0 6px 20px rgba(40, 50, 40, 0.25);
  animation: rise 0.22s ease-out;
  pointer-events: none;
}

/* --- misc ----------------------------------------------------------------- */

.kv {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.kv b {
  color: var(--ink);
  font-weight: 700;
}

.note {
  font-size: 12.5px;
  color: var(--ink-dim);
  line-height: 1.65;
  margin: 0;
}

.bar-mini {
  height: 8px;
  border-radius: 999px;
  background: var(--card-3);
  overflow: hidden;
}

.bar-mini > i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--lake);
}

.steps {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.steps > div {
  display: grid;
  grid-template-columns: 22px 1fr;
  gap: 9px;
  align-items: start;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--ink-dim);
}

.steps b {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 12px;
  color: #fff;
  background: var(--lake);
  border-radius: 999px;
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
}

.steps em {
  font-style: normal;
  font-weight: 700;
  color: var(--lake);
}

.grid2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px 12px;
}

.locked {
  opacity: 0.55;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
